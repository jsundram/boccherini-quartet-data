name: Music change preview

# On any PR that touches quartet sources, prove the affected quartet still
# engraves and post a before/after render comparison — generated by CI from the
# two git revisions, so reviewers never rely on author-supplied images.

on:
  pull_request:
    paths:
      - 'lilypond/Op*/**'

permissions:
  contents: write        # push the orphan 'previews' branch that hosts images
  pull-requests: write   # post/update the preview comment

concurrency:
  group: music-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need base + head to render before/after

      - name: Install LilyPond, Ghostscript, poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y lilypond ghostscript poppler-utils
          lilypond --version | head -1

      - name: Render before/after and prove it engraves
        id: render
        working-directory: lilypond
        run: |
          bash tools/ci-preview.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --publish previews \
            "${{ github.event.pull_request.number }}" \
            "${{ github.repository }}"

      - name: Upload renders as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-preview
          path: lilypond/.ci-preview-out/**/*.png
          if-no-files-found: ignore

      - name: Find existing preview comment
        if: always()
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: music-change-preview

      - name: Post / update preview comment
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: lilypond/.ci-preview-out/comment.md
          edit-mode: replace
